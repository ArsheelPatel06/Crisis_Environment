[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cyber-crisis-env"
version = "0.2.0"
description = "OpenEnv cyber crisis incident-response simulation environment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "openenv-core>=0.2.0",
  "requests",
  "matplotlib",
]

[project.scripts]
server = "server.run:main"

[project.optional-dependencies]
train = [
  "torch>=2.2.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "datasets>=2.19.0",
  "peft>=0.11.0",
  "trl>=0.15.0",
  "bitsandbytes",
  "sentencepiece>=0.1.99",
]

[project.urls]
Homepage = "https://github.com/ArsheelPatel06/Crisis_Environment"

[tool.hatch.build.targets.wheel]
packages = ["server", "simulator", "training"]

[tool.uv]
package = true
